<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hojin Kang, founder of GRINDA AI</title>
  <desc id="desc">Building RINDA and AI agents for global B2B sales</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#102a43"/>
      <stop offset="1" stop-color="#123b4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="55" r="150" fill="#2dd4bf" opacity="0.16" filter="url(#blur)"/>
  <circle cx="1135" cy="305" r="175" fill="#60a5fa" opacity="0.15" filter="url(#blur)"/>

  <g opacity="0.22" fill="none" stroke="#99f6e4" stroke-width="2">
    <path d="M886 86 C950 36 1031 41 1080 95 S1168 175 1192 132"/>
    <path d="M852 232 C930 164 1008 181 1061 237 S1147 327 1200 264"/>
    <circle cx="885" cy="86" r="5" fill="#99f6e4"/>
    <circle cx="1080" cy="95" r="5" fill="#99f6e4"/>
    <circle cx="1061" cy="237" r="5" fill="#99f6e4"/>
  </g>

  <rect x="74" y="62" width="76" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="74" y="132" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="750" letter-spacing="-1.5">HOJIN KANG</text>
  <text x="76" y="181" fill="#99f6e4" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="650" letter-spacing="1.4">FOUNDER, GRINDA AI · BUILDING RINDA</text>
  <text x="76" y="250" fill="#dbeafe" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="450">Making global B2B sales executable for smaller teams.</text>
  <text x="76" y="303" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">AI agents · global sales · applied automation · Daejeon, South Korea</text>
</svg>
